name: .NET Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # The net48 targeting pack ships with the Windows runner image.
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    # Builds "work monitor.sln" in Release, then packages dist/WorkMonitor-<version>-x64.msi.
    - name: Build Release and MSI
      shell: pwsh
      run: .\build-msi.ps1

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: WorkMonitor-msi
        path: dist/*.msi
        if-no-files-found: error
