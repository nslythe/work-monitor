name: .NET Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # The net48 targeting pack ships with the Windows runner image.
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    # Builds "work monitor.sln" in Release, then packages dist/WorkMonitor-<version>-x64.msi.
    # On a release the tag is the version, so the MSI and the application match the release.
    - name: Build Release and MSI
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        if ($env:GITHUB_EVENT_NAME -eq 'release') {
          .\build-msi.ps1 -Version $env:RELEASE_TAG
        } else {
          .\build-msi.ps1
        }

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkMonitor-msi
        path: dist/*.msi
        if-no-files-found: error

    - name: Upload MSI to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.msi
